<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>إدارة المقالات · زاد</title>
<style>@font-face{font-family:Zad;src:url(/fonts/pa400.woff2) format("woff2");font-weight:400}@font-face{font-family:Zad;src:url(/fonts/pa700.woff2) format("woff2");font-weight:700}
*{box-sizing:border-box}body{margin:0;font-family:Zad,system-ui,sans-serif;background:#f6f4ef;color:#1f2340}main{max-width:680px;margin:auto;padding:18px}h1{font-size:22px;margin:6px 0 4px}p.n{color:#6d6a73;font-size:13px;line-height:1.8}
.c{background:#fff;border:1px solid #e6e1d6;border-radius:18px;padding:16px;margin-top:12px}label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid #d9d3c6;border-radius:12px;background:#fff;color:inherit}textarea{min-height:240px;line-height:1.9}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 16px;background:#34457a;color:#fff;cursor:pointer}button.g{background:#eee9df;color:#1f2340}button.d{background:#fbe9e3;color:#9a4f2e}.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #eee}.it:first-child{border:0}.it b{flex:1;font-size:14px}.k{font-size:12px;color:#6d6a73}#msg{min-height:20px;font-size:13px;color:#9a4f2e;margin-top:8px}a{color:#34457a}</style></head><body><main>
<h1>إدارة المقالات</h1><p class="n">أضف مقالًا يظهر لكل المستخدمين في قسم «مقالات». نفس رمز الدخول المستخدم في <a href="/admin/videos">إدارة المقاطع</a>. اكتب المصدر ورابطه تحت كل مقال تنقله. افصل الفقرات بسطر فارغ، وابدأ العنوان الفرعي بـ ## .</p>
<div id="login" class="c" hidden><label for="code">رمز المشرف</label><input id="code" type="password" autocomplete="current-password"><div class="r" style="margin-top:10px"><button id="go">دخول</button></div></div>
<div id="app" hidden><div class="c"><label for="c">القسم</label><select id="c"><option value="isl">إسلامية</option><option value="cul">ثقافية</option><option value="his">تاريخية</option></select>
<label for="t">العنوان</label><input id="t" maxlength="160"><label for="au">الكاتب</label><input id="au" maxlength="120"><label for="src">اسم المصدر</label><input id="src" maxlength="120" placeholder="مثال: IslamHouse"><label for="url">رابط المصدر</label><input id="url" type="url" dir="ltr" placeholder="https://"><label for="body">النص</label><textarea id="body" maxlength="60000"></textarea>
<div class="r" style="margin-top:12px"><button id="save">نشر المقال</button><button class="g" id="out">خروج</button></div><div id="msg" role="status"></div></div>
<div class="c"><b>المقالات المضافة</b><div id="list" class="k" style="margin-top:8px">…</div></div></div>
<script>
const $=s=>document.querySelector(s);let S=localStorage.getItem('zad.vadm')||'';
const api=(p,b)=>fetch('/api/articles/admin/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S},body:b?JSON.stringify(b):undefined}).then(async r=>{const j=await r.json().catch(()=>({}));if(r.status===401){S='';localStorage.removeItem('zad.vadm');show();throw new Error('auth')}if(!r.ok)throw new Error(j.error||('خطأ '+r.status));return j});
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CN={isl:'إسلامية',cul:'ثقافية',his:'تاريخية'};
function show(){$('#login').hidden=!!S;$('#app').hidden=!S;if(S)load()}
async function load(){try{const j=await api('list');$('#list').innerHTML=j.items.length?j.items.map(a=>`<div class="it"><b>${esc(a.t)}<div class="k">${CN[a.c]||''} · ${new Date(a.created).toLocaleDateString('ar-SA')}</div></b><a href="/#article/${a.id}" target="_blank">عرض</a><button class="d" data-id="${a.id}">حذف</button></div>`).join(''):'لا توجد مقالات مضافة بعد.';
 document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{if(!confirm('حذف المقال نهائيًا؟'))return;await api('delete',{id:b.dataset.id});load()})}catch(e){}}
$('#go').onclick=async()=>{const r=await fetch('/api/videos/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('#code').value})});const j=await r.json().catch(()=>({}));if(j.s){S=j.s;localStorage.setItem('zad.vadm',S);show()}else alert(r.status===429?'محاولات كثيرة، حاول لاحقًا':'الرمز غير صحيح')};
$('#save').onclick=async()=>{$('#msg').textContent='';try{const j=await api('save',{c:$('#c').value,t:$('#t').value,au:$('#au').value,src:$('#src').value,url:$('#url').value,body:$('#body').value});$('#msg').textContent='تم النشر ✓';['#t','#au','#src','#url','#body'].forEach(s=>$(s).value='');load()}catch(e){if(e.message!=='auth')$('#msg').textContent=e.message}};
$('#out').onclick=()=>{S='';localStorage.removeItem('zad.vadm');show()};show();
</script></main></body></html>
