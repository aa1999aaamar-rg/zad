<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>الإشراف على الميزات الجماعية · زاد</title>
<style>@font-face{font-family:Zad;src:url(/fonts/pa400.woff2) format("woff2");font-weight:400}@font-face{font-family:Zad;src:url(/fonts/pa700.woff2) format("woff2");font-weight:700}
*{box-sizing:border-box}body{margin:0;font-family:Zad,system-ui,sans-serif;background:#f6f4ef;color:#1f2340}main{max-width:760px;margin:auto;padding:18px}h1{font-size:22px;margin:6px 0 4px}p.n{color:#6d6a73;font-size:13px;line-height:1.8}
.c{background:#fff;border:1px solid #e6e1d6;border-radius:18px;padding:16px;margin-top:12px}label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}input,select{width:100%;font:inherit;padding:10px 12px;border:1px solid #d9d3c6;border-radius:12px;background:#fff;color:inherit}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:9px 14px;background:#34457a;color:#fff;cursor:pointer}button.g{background:#eee9df;color:#1f2340}button.d{background:#fbe9e3;color:#9a4f2e}.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.it{display:flex;gap:8px;align-items:center;padding:10px 0;border-top:1px solid #eee;flex-wrap:wrap}.it>div{flex:1;min-width:200px;font-size:14px}.k{font-size:12px;color:#6d6a73}.rep{color:#9a4f2e;font-weight:700}.hid{background:#fbe9e3;border-radius:8px;padding:1px 6px;font-size:11px;color:#9a4f2e}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tabs button{background:#eee9df;color:#1f2340}.tabs button.on{background:#34457a;color:#fff}a{color:#34457a}.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.st div{background:#f6f4ef;border-radius:12px;padding:8px;text-align:center}.st b{display:block;font-size:18px}</style></head><body><main>
<h1>الإشراف على الميزات الجماعية</h1><p class="n">ختمات الفقيد والجهات، صفحات المرضى والمتوفين، تحديات الذكر، وحلقات التحفيظ. نفس رمز الدخول المستخدم في <a href="/admin/videos">إدارة المقاطع</a>. المحتوى يُنشر مباشرة، وأي صفحة أو ختمة يبلّغ عنها ٣ أشخاص تختفي تلقائيًا حتى تراجعها هنا.</p>
<div id="login" class="c" hidden><label for="code">رمز المشرف</label><input id="code" type="password" autocomplete="current-password"><div class="r" style="margin-top:10px"><button id="go">دخول</button></div></div>
<div id="app" hidden>
<div class="c"><div class="st" id="stats"></div></div>
<div class="tabs"><button data-tab="rep" class="on">المُبلَّغ عنها</button><button data-tab="pages">الصفحات</button><button data-tab="kh">الختمات</button><button data-tab="ch">تحديات الذكر</button><button data-tab="hq">حلقات التحفيظ</button><button data-tab="dw">الديوانية</button><button class="g" id="out">خروج</button></div>
<div class="c" id="box">…</div>
<div class="c" id="chform" hidden><b>تحدٍّ جديد / تعديل</b>
<label for="ct">العنوان</label><input id="ct" maxlength="70" placeholder="مثال: مئة ألف استغفار هذا الأسبوع"><label for="cd">الذكر</label><input id="cd" maxlength="80" placeholder="أستغفر الله"><label for="cg">الهدف (العدد)</label><input id="cg" inputmode="numeric" value="100000">
<label for="cs">يبدأ</label><input id="cs" type="datetime-local"><label for="ce">ينتهي</label><input id="ce" type="datetime-local"><label class="r" style="font-weight:400"><input id="cr" type="checkbox" style="width:auto"> يتكرر كل أسبوع</label><input id="cid" type="hidden">
<div class="r" style="margin-top:10px"><button id="csave">حفظ التحدي</button><button class="g" id="cclr">جديد</button></div><div id="msg" class="k" role="status"></div></div>
<script>
const $=s=>document.querySelector(s);let S=localStorage.getItem('zad.vadm')||'',D=null,DW=null,TAB='rep';
const api=(p,b)=>fetch('/api/social/admin/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S},body:b?JSON.stringify(b):undefined}).then(async r=>{const j=await r.json().catch(()=>({}));if(r.status===401){S='';localStorage.removeItem('zad.vadm');show();throw new Error('auth')}if(!r.ok)throw new Error(j.error||('خطأ '+r.status));return j});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const dt=t=>t?new Date(t).toLocaleString('ar-SA',{dateStyle:'medium',timeStyle:'short'}):'';
const KN={g:'ختمة جماعية',d:'ختمة لروح فقيد',o:'ختمة جهة'},PN={s:'مريض',m:'متوفى'};
function show(){$('#login').hidden=!!S;$('#app').hidden=!S;if(S)load()}
async function load(){try{DW=await api('dw')}catch(e){DW={posts:[],users:[],stats:{}}}try{D=await api('list');const s=D.stats||{};$('#stats').innerHTML=[['دوائر العائلة',s.fams],['أعضاء الدوائر',s.members],['ثنائيات الفجر',s.paired],['روابط الأجر',s.refs],['فتحات الروابط',s.ref_opens],['تحديات',D.chals.length],['حلقات التحفيظ',s.halaqas],['أعضاء الحلقات',s.hmembers]].map(([a,b])=>`<div><b>${b||0}</b><span class="k">${a}</span></div>`).join('');draw()}catch(e){if(e.message==='auth')return;if(!D){D={pages:[],khatmas:[],chals:[],reports:[],halaqas:[],hnotes:[]};draw()}if(TAB!=='dw')$('#box').textContent=e.message}}
const pgRow=p=>`<div class="it"><div><b>${esc(p.name)}</b> <span class="k">· ${PN[p.kind]} · ${p.count} دعوا</span> ${p.hidden?'<span class="hid">مخفية</span>':''} ${p.reports?`<span class="rep">${p.reports} بلاغ</span>`:''}<div class="k">${esc(p.dua)} ${esc(p.dates)} ${esc(p.fun)}</div><div class="k">${dt(p.created)}</div></div><a href="/#${p.kind==='s'?'sick':'mem'}/${p.id}" target="_blank">عرض</a>${p.hidden?`<button class="g" data-a="page" data-op="unhide" data-id="${p.id}">إظهار</button>`:`<button class="g" data-a="page" data-op="hide" data-id="${p.id}">إخفاء</button>`}<button class="d" data-a="page" data-op="delete" data-id="${p.id}">حذف</button></div>`;
const khRow=k=>`<div class="it"><div><b>${esc(k.title)}</b> <span class="k">· ${KN[k.kind]||''} · ${k.done}/${k.unit} · الجولة ${k.round}</span> ${k.hidden?'<span class="hid">مخفية</span>':''} ${k.reports?`<span class="rep">${k.reports} بلاغ</span>`:''}<div class="k">${esc(k.dua||'')}</div><div class="k">${dt(k.created)}</div></div><a href="/#khatma/${k.id}" target="_blank">عرض</a>${k.hidden?`<button class="g" data-a="khatma" data-op="unhide" data-id="${k.id}">إظهار</button>`:`<button class="g" data-a="khatma" data-op="hide" data-id="${k.id}">إخفاء</button>`}<button class="d" data-a="khatma" data-op="delete" data-id="${k.id}">حذف</button></div>`;
const chRow=c=>`<div class="it"><div><b>${esc(c.title)}</b> <span class="k">· ${esc(c.dhikr)}</span><div class="k">${c.count.toLocaleString('ar-SA')} / ${c.goal.toLocaleString('ar-SA')} · ${{live:'جارٍ الآن',soon:'قادم',ended:'منتهٍ'}[c.status]} · ${dt(c.starts)} ← ${dt(c.ends)}${c.recur?' · أسبوعي':''}${c.last!=null?' · الأسبوع الماضي '+Number(c.last).toLocaleString('ar-SA'):''}</div></div><button class="g" data-edit="${c.id}">تعديل</button>${c.status==='ended'?`<button class="g" data-a="chal" data-op="reopen" data-id="${c.id}">إعادة فتح</button>`:`<button class="g" data-a="chal" data-op="end" data-id="${c.id}">إنهاء</button>`}${c.id==='fri-salawat'?'':`<button class="d" data-a="chal" data-op="delete" data-id="${c.id}">حذف</button>`}</div>`;
const TG=t=>{t=t||{};return t.k==='j'?'الجزء '+t.v:t.k==='p'?'صفحة '+t.v:'سورة رقم '+(t.v||'')};
const hqRow=h=>{const t=JSON.parse(h.target||'{}');return`<div class="it"><div><b>${esc(h.name)}</b> <span class="k">· ${h.id} · ${h.n}/30 عضو · ${TG(t)}</span> ${h.hidden?'<span class="hid">مخفية</span>':''} ${h.reports?`<span class="rep">${h.reports} بلاغ</span>`:''} ${h.hidden_notes?`<span class="hid">${h.hidden_notes} ملاحظة مخفية</span>`:''}<div class="k">${dt(h.created)}</div></div>${h.hidden?`<button class="g" data-a="halaqa" data-op="unhide" data-id="${h.id}">إظهار</button>`:`<button class="g" data-a="halaqa" data-op="hide" data-id="${h.id}">إخفاء</button>`}<button class="d" data-a="halaqa" data-op="delete" data-id="${h.id}">حذف</button></div>`};
const hnRow=n=>`<div class="it"><div><b>${esc(n.name)}</b> <span class="k">· حلقة ${n.hid}</span> ${n.note_hidden?'<span class="hid">مخفية</span>':''} ${n.note_rep?`<span class="rep">${n.note_rep} بلاغ</span>`:''}<div class="k">«${esc(n.note)}»</div></div>${n.note_hidden?`<button class="g" data-a="halaqa" data-op="shownote" data-id="${n.hid}" data-mid="${n.mid}">إظهار</button>`:''}<button class="d" data-a="halaqa" data-op="clearnote" data-id="${n.hid}" data-mid="${n.mid}">حذف الملاحظة</button></div>`;

const dwRow=p=>`<div class="it"><div><b>${esc(p.name||'؟')}</b> <span class="k">· ${p.id} · ❤ ${p.likes} · ↩ ${p.replies} · 🔁 ${p.reposts}${p.reply_to?' · رد':''}${p.quote_of?' · اقتباس':''}</span> ${p.pinned?'<span class="hid" style="background:#e3e8f6;color:#34457a">مثبّتة</span>':''} ${p.hidden?'<span class="hid">مخفية</span>':''} ${p.reports?`<span class="rep">${p.reports} بلاغ</span>`:''} ${p.banned?'<span class="rep">صاحبها موقوف</span>':''}<div style="white-space:pre-wrap;margin:4px 0">${esc(p.text)}</div>${p.img?`<a href="/api/social/dw/img/${p.img}" target="_blank" class="k">📷 الصورة</a> `:''}<div class="k">${dt(p.at)}</div></div><a href="/#diwan/p/${p.id}" target="_blank">عرض</a>${p.pinned?`<button class="g" data-a="dwpost" data-op="unpin" data-id="${p.id}">إلغاء التثبيت</button>`:`<button class="g" data-a="dwpost" data-op="pin" data-id="${p.id}">تثبيت</button>`}${p.hidden?`<button class="g" data-a="dwpost" data-op="unhide" data-id="${p.id}">إظهار</button>`:`<button class="g" data-a="dwpost" data-op="hide" data-id="${p.id}">إخفاء</button>`}<button class="d" data-a="dwpost" data-op="delete" data-id="${p.id}">حذف</button></div>`;
const dwUser=u=>`<div class="it"><div><b>${esc(u.name)}</b> <span class="k">· ${u.uid} · ${u.posts} تغريدة${u.reports?` · ${u.reports} بلاغ`:''}</span> ${u.banned?'<span class="rep">موقوف</span>':''}<div class="k">${esc(u.bio||'')} · ${dt(u.at)}</div></div><a href="/#diwan/u/${u.uid}" target="_blank">الملف</a>${u.banned?`<button class="g" data-a="dwuser" data-op="unban" data-uid="${u.uid}">رفع الإيقاف</button>`:`<button class="d" data-a="dwuser" data-op="ban" data-uid="${u.uid}">إيقاف</button>`}<button class="d" data-a="dwuser" data-op="purge" data-uid="${u.uid}">حذف الحساب وكل محتواه</button></div>`;
function draw(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB));$('#chform').hidden=TAB!=='ch';let h='';
 if(TAB==='rep'){const rp=D.reports||[];const pg=D.pages.filter(p=>p.reports||p.hidden),kh=D.khatmas.filter(k=>k.reports||k.hidden);const hq=(D.halaqas||[]).filter(x=>x.reports||x.hidden),hn=(D.hnotes||[]).filter(x=>x.note_rep||x.note_hidden);h=(pg.map(pgRow).join('')+kh.map(khRow).join('')+hq.map(hqRow).join('')+hn.map(hnRow).join('')+((DW&&DW.posts)||[]).filter(p=>p.reports||p.hidden).map(dwRow).join(''))||'<p class="k">لا توجد بلاغات 👍</p>';if(rp.length)h+=`<p class="k" style="margin-top:10px">آخر البلاغات: ${rp.slice(0,20).map(r=>esc(r.target)+' ('+r.n+')'+(r.reasons?' «'+esc(r.reasons)+'»':'')).join('، ')}</p>`}
 else if(TAB==='pages')h=D.pages.map(pgRow).join('')||'<p class="k">لا توجد صفحات بعد.</p>';
 else if(TAB==='kh')h=D.khatmas.map(khRow).join('')||'<p class="k">لا توجد ختمات بعد.</p>';
 else if(TAB==='hq')h=((D.halaqas||[]).map(hqRow).join('')||'<p class="k">لا توجد حلقات بعد.</p>')+((D.hnotes||[]).length?'<p class="k" style="margin-top:12px"><b>ملاحظات الأعضاء</b></p>'+D.hnotes.map(hnRow).join(''):'');
 else if(TAB==='dw'){const s=(DW&&DW.stats)||{};h=`<p class="k">${s.users||0} مستخدم · ${s.posts||0} تغريدة/رد · ${s.reposts||0} إعادة نشر · ${s.likes||0} إعجاب · ${s.follows||0} متابعة · ${s.reports||0} بلاغ</p><p class="k"><b>التغريدات</b> (المثبتة والمُبلّغ عنها أولًا)</p>`+(((DW&&DW.posts)||[]).map(dwRow).join('')||'<p class="k">لا تغريدات بعد.</p>')+'<p class="k" style="margin-top:12px"><b>الحسابات</b></p>'+(((DW&&DW.users)||[]).map(dwUser).join('')||'<p class="k">لا حسابات بعد.</p>')}
 else h=D.chals.map(chRow).join('')||'<p class="k">لا توجد تحديات.</p>';
 $('#box').innerHTML=h;
 document.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{if((b.dataset.op==='delete'||b.dataset.op==='purge'||b.dataset.op==='ban')&&!confirm(b.dataset.op==='ban'?'إيقاف هذا الحساب في الديوانية؟':'حذف نهائي؟'))return;try{await api(b.dataset.a,{op:b.dataset.op,id:b.dataset.id,mid:b.dataset.mid,uid:b.dataset.uid});load()}catch(e){alert(e.message)}});
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const c=D.chals.find(x=>x.id===b.dataset.edit);if(!c)return;$('#cid').value=c.id;$('#ct').value=c.title;$('#cd').value=c.dhikr;$('#cg').value=c.goal;$('#cs').value=loc(c.starts);$('#ce').value=loc(c.ends);$('#cr').checked=!!c.recur;$('#chform').scrollIntoView({behavior:'smooth'})})}
const loc=t=>{const d=new Date(t);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;draw()});
$('#cclr').onclick=()=>{['#cid','#ct','#cd'].forEach(s=>$(s).value='');$('#cg').value='100000';$('#cs').value=loc(Date.now());$('#ce').value=loc(Date.now()+864e5);$('#cr').checked=false};
$('#csave').onclick=async()=>{$('#msg').textContent='';try{await api('chal',{op:'save',id:$('#cid').value,title:$('#ct').value,dhikr:$('#cd').value,goal:+$('#cg').value,starts:new Date($('#cs').value).getTime(),ends:new Date($('#ce').value).getTime(),recur:$('#cr').checked});$('#msg').textContent='تم الحفظ ✓';load()}catch(e){if(e.message!=='auth')$('#msg').textContent=e.message}};
$('#go').onclick=async()=>{const r=await fetch('/api/videos/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('#code').value})});const j=await r.json().catch(()=>({}));if(j.s){S=j.s;localStorage.setItem('zad.vadm',S);show()}else alert(r.status===429?'محاولات كثيرة، حاول لاحقًا':'الرمز غير صحيح')};
$('#out').onclick=()=>{S='';localStorage.removeItem('zad.vadm');show()};$('#cclr').click();show();
</script></div></main></body></html>
