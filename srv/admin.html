<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#34457a"><title>لوحة المقاطع · زاد</title>
<link rel="icon" href="/icons/icon-192.png">
<style>
@font-face{font-family:P;src:url(/fonts/pl400.woff2) format("woff2");font-weight:400}@font-face{font-family:P;src:url(/fonts/pl700.woff2) format("woff2");font-weight:700}
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mute:#6b7280;--line:#e7e2d8;--acc:#34457a;--clay:#c0693f;--ok:#2f7d5b;--bad:#b3412e}
@media(prefers-color-scheme:dark){:root{--bg:#10141f;--card:#182033;--ink:#eef0f6;--mute:#9aa3b5;--line:#273149;--acc:#8fa3e0;--clay:#e08a5f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 P,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 40px}
header{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}header b{font-size:17px;flex:1}
header button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:10px;padding:6px 10px;font:inherit;font-size:13px}
main{max-width:760px;margin:0 auto;padding:14px}
.tabs{display:flex;gap:6px;overflow:auto;margin:0 0 12px}.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px}.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 12px}
.vid{display:grid;grid-template-columns:150px 1fr;gap:12px}@media(max-width:480px){.vid{grid-template-columns:1fr}}
video{width:100%;max-height:420px;background:#000;border-radius:12px;aspect-ratio:9/16;object-fit:contain}
.t{font-weight:700;font-size:16px}.m{color:var(--mute);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.b{border:0;border-radius:12px;padding:9px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}.ok{background:var(--ok);color:#fff}.no{background:var(--bad);color:#fff}.gh{background:transparent;border:1px solid var(--line);color:var(--ink)}.pr{background:var(--acc);color:#fff}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 9px;margin-inline-start:6px;background:#f3d9cc;color:#7a3519}.tag.g{background:#d5eadf;color:#1f5a40}
input{width:100%;font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:6px 0}
.empty{text-align:center;color:var(--mute);padding:30px 10px}.c{border-top:1px solid var(--line);padding:10px 0}.c:first-child{border-top:0}
#login{max-width:380px;margin:12vh auto;padding:20px}#msg{min-height:22px;color:var(--bad);font-size:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:9px 16px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none}.toast.s{opacity:1}
</style></head><body>
<div id="login" class="card" hidden><div class="t" style="font-size:20px">لوحة مشرف المقاطع</div><p class="m">هذه الصفحة خاصة بمشرف تطبيق «زاد» لمتابعة المقاطع وحذف المخالف. أدخل رمز الدخول.</p>
<form id="lf"><input id="code" type="password" autocomplete="current-password" placeholder="رمز الدخول" dir="ltr" required><div id="msg"></div><button class="b pr" style="width:100%">دخول</button></form></div>
<div id="app" hidden><header><b>مقاطع الأسبوع · الإشراف</b><button id="rf">تحديث</button></header><main>
<div class="tabs" id="tabs"><button data-t="live" class="on">المنشورة</button><button data-t="rep">المُبلَّغ عنها</button><button data-t="comments">التعليقات</button><button data-t="settings">الإعدادات</button></div>
<div id="out"></div></main></div><div class="toast" id="toast"></div>
<script>
(function(){'use strict';
var S=localStorage.getItem('zad.vadm')||'',D=null,TAB='live';
var $=function(s){return document.querySelector(s)};
var ar=function(x){return String(x).replace(/\d/g,function(d){return'٠١٢٣٤٥٦٧٨٩'[d]})};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('s');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('s')},2400)}
function api(p,b){return fetch('/api/videos/admin/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S},body:b?JSON.stringify(b):undefined}).then(function(r){return r.json().catch(function(){return{ok:false}}).then(function(j){if(r.status===401){logout();throw new Error('auth')}return j})})}
function logout(){S='';localStorage.removeItem('zad.vadm');$('#app').hidden=true;$('#login').hidden=false}
function ago(ms){var m=Math.round(ms/60000);if(m<60)return ar(Math.max(1,m))+' دقيقة';var h=Math.round(m/60);if(h<48)return ar(h)+' ساعة';return ar(Math.round(h/24))+' يوم'}
function left(ms){if(ms<=0)return'انتهى';var h=Math.floor(ms/3600000);if(h<24)return ar(Math.max(1,h))+' ساعة';var d=Math.ceil(h/24);return ar(d)+(d<=10&&d>2?' أيام':' يوم')}
function mb(n){return ar((n/1048576).toFixed(1))+' م.ب'}
function dur(s){s=Math.round(s||0);return'<bdi dir="ltr">'+ar(Math.floor(s/60))+':'+ar(String(s%60).padStart(2,'0'))+'</bdi>'}
$('#lf').onsubmit=function(e){e.preventDefault();$('#msg').textContent='';fetch('/api/videos/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('#code').value})}).then(function(r){return r.json()}).then(function(j){if(j.ok){S=j.s;localStorage.setItem('zad.vadm',S);$('#code').value='';start()}else $('#msg').textContent=j.error==='rate'?'محاولات كثيرة، جرّب بعد ساعة':'الرمز غير صحيح'}).catch(function(){$('#msg').textContent='تعذّر الاتصال'})};
$('#tabs').onclick=function(e){var b=e.target.closest('button');if(!b)return;TAB=b.dataset.t;[].forEach.call(document.querySelectorAll('#tabs button'),function(x){x.classList.toggle('on',x===b)});render()};
$('#rf').onclick=function(){load()};
function start(){$('#login').hidden=true;$('#app').hidden=false;load()}
function load(){return api('list').then(function(j){if(!j.ok)return toast('تعذّر التحميل');D=j;var n=j.live.length;document.querySelector('[data-t=live]').textContent='المنشورة'+(n?' ('+ar(n)+')':'');var r=rep();document.querySelector('[data-t=rep]').textContent='المُبلَّغ عنها'+(r.v.length+r.c.length?' ('+ar(r.v.length+r.c.length)+')':'');render()}).catch(function(){})}
function rep(){return{v:D.live.filter(function(v){return v.hidden||v.reports}).sort(function(a,b){return b.hidden-a.hidden||b.reports-a.reports}),c:D.comments.filter(function(c){return c.hidden||c.reports}).sort(function(a,b){return b.hidden-a.hidden||b.reports-a.reports})}}
function ccard(c){return'<div class="c" data-c="'+c.id+'"><b>'+esc(c.name)+'</b>'+(c.hidden?'<span class="tag">مخفي ('+ar(c.reports)+' بلاغات)</span>':c.reports?'<span class="tag">'+ar(c.reports)+' بلاغ</span>':'')+'<div>'+esc(c.text)+'</div><div class="m">على «'+esc(c.title||'')+'» · قبل '+ago(D.now-c.at)+'</div><div class="row">'+(c.hidden?'<button class="b ok" data-ca="unhide">إظهار</button>':'')+'<button class="b no" data-ca="delete">حذف التعليق</button></div></div>'}
function vsrc(v){return'/api/videos/v/'+v.id+'?a='+S}
function vcard(v){var now=D.now;var tags='';if(v.hidden)tags+='<span class="tag">مخفي ('+ar(v.reports)+' بلاغات)</span>';else if(v.reports)tags+='<span class="tag">'+ar(v.reports)+' بلاغ</span>';
 if(v.official)tags='<span class="tag" style="background:#d4a646;color:#1d1a33">حلقة رسمية · عمار</span>'+tags;
 var info='نُشر قبل '+ago(now-v.approved_at)+(v.official?' · لا تُحذف تلقائيًا':' · يُحذف بعد '+left(v.expires_at-now))+' · ❤ '+ar(v.likes)+' · تعليقات '+ar(v.comments);
 var btn=(v.hidden?'<button class="b ok" data-a="unhide">إظهار (البلاغات غير صحيحة)</button>':'<button class="b gh" data-a="hide">إخفاء</button>')+'<button class="b no" data-a="delete">حذف الآن</button>';
 return'<div class="card vid" data-id="'+v.id+'"><video controls playsinline preload="metadata" '+(v.poster?'poster="/api/videos/p/'+v.id+'?a='+S+'"':'')+' src="'+vsrc(v)+'"></video><div><div class="t">'+esc(v.title)+tags+'</div><div class="m">باسم: '+esc(v.name)+' · '+dur(v.dur)+' · '+mb(v.size)+'</div><div class="m">'+info+'</div><div class="row">'+btn+'</div></div></div>'}
function render(){var o=$('#out');if(!D)return;
 if(TAB==='live'){o.innerHTML=D.live.length?'<p class="m">كل مقطع يُنشر مباشرة ويُحذف تلقائيًا بعد ٧ أيام (ما عدا «حلقات عمار» الرسمية: تبقى، والبلاغات عليها تنبّهك فقط). احذف أي مقطع فيه موسيقى أو صور غير لائقة أو محتوى غير صحيح.</p>'+D.live.map(vcard).join(''):'<div class="card empty">لا توجد مقاطع منشورة الآن</div>'}
 else if(TAB==='rep'){var r=rep();o.innerHTML=(r.v.length||r.c.length)?'<p class="m">ما عليه ٣ بلاغات أو أكثر يختفي تلقائيًا حتى تقرّر: إظهار أو حذف.</p>'+r.v.map(vcard).join('')+(r.c.length?'<div class="card">'+r.c.map(ccard).join('')+'</div>':''):'<div class="card empty">لا توجد بلاغات ✓</div>'}
 else if(TAB==='comments'){o.innerHTML='<div class="card">'+(D.comments.length?D.comments.map(ccard).join(''):'<div class="empty">لا توجد تعليقات</div>')+'</div>'}
 else{var st=D.stats;o.innerHTML='<div class="card"><div class="t">التخزين</div><div class="m">'+ar(st.clips)+' مقطع منشور · '+mb(st.bytes)+' مستخدمة الآن (يُحفظ آخر ٣٠ مقطع لكل حساب، والحلقات الرسمية دائماً)<br>حذف تلقائي: '+ar(st.auto_del||0)+(st.r2&&st.r2.total?' · R2 الكلي: '+mb(st.r2.total):'')+'</div></div>'
  +'<div class="card"><div class="t">تنبيه عند وصول مقطع جديد</div><div class="m">يصلك تنبيه على هذا الجهاز كلما نُشر مقطع جديد، لكي تراجعه وتحذفه بسرعة إن كانت فيه مخالفة. على الآيفون: افتح هذه الصفحة من داخل تطبيق «زاد» المضاف للشاشة الرئيسية. الأجهزة المفعّلة: '+ar(st.admin_devices)+'</div><div class="row"><button class="b pr" id="nt">فعّل التنبيه على هذا الجهاز</button><button class="b gh" id="ntoff">أوقفه</button></div></div>'
  +'<div class="card"><div class="t">تغيير رمز الدخول</div><form id="pf"><input id="po" type="password" placeholder="الرمز الحالي" dir="ltr" required autocomplete="current-password"><input id="pn" type="password" placeholder="الرمز الجديد (٨ أحرف على الأقل)" dir="ltr" minlength="8" required autocomplete="new-password"><input id="pn2" type="password" placeholder="أعد كتابة الرمز الجديد" dir="ltr" required autocomplete="new-password"><button class="b pr">حفظ الرمز الجديد</button></form><p class="m">بعد التغيير تخرج كل الأجهزة وتدخل بالرمز الجديد.</p></div>'
  +'<div class="card"><button class="b gh" id="lo">تسجيل الخروج</button></div>';
  $('#pf').onsubmit=function(e){e.preventDefault();if($('#pn').value!==$('#pn2').value)return toast('الرمزان غير متطابقين');api('pass',{old:$('#po').value,new:$('#pn').value}).then(function(j){if(j.ok){toast('تم تغيير الرمز، ادخل بالرمز الجديد');logout()}else toast(j.error==='wrong'?'الرمز الحالي غير صحيح':'الرمز الجديد قصير')}).catch(function(){})};
  $('#lo').onclick=function(){api('logout',{}).catch(function(){});logout()};
  $('#nt').onclick=notifyOn;$('#ntoff').onclick=notifyOff}}
function b64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),o=new Uint8Array(b.length);for(var i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o}
function reg(){if(!('serviceWorker' in navigator)||!('PushManager' in window))return Promise.reject(new Error('nosup'));return navigator.serviceWorker.getRegistration('/').then(function(r){return r||navigator.serviceWorker.register('/sw.js',{scope:'/'})}).then(function(){return navigator.serviceWorker.ready})}
function notifyOn(){reg().then(function(r){return Notification.requestPermission().then(function(p){if(p!=='granted')throw new Error('perm');return r.pushManager.getSubscription().then(function(s){return s||fetch('/api/push/key').then(function(x){return x.json()}).then(function(k){return r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(k.key)})})})})}).then(function(s){return api('notify',{sub:s.toJSON()})}).then(function(j){toast(j.ok?'تم ✓ سيصلك تنبيه مع كل مقطع جديد':'تعذّر التفعيل');load()}).catch(function(e){toast(e.message==='perm'?'يجب أن تسمح بالتنبيهات':e.message==='nosup'?'هذا المتصفح لا يدعم التنبيهات هنا':'تعذّر التفعيل')})}
function notifyOff(){reg().then(function(r){return r.pushManager.getSubscription()}).then(function(s){if(!s)return{ok:true};return api('notify',{off:true,endpoint:s.endpoint})}).then(function(){toast('أوقفت التنبيه على هذا الجهاز');load()}).catch(function(){toast('تعذّر')})}
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(b){var id=b.closest('[data-id]').dataset.id,a=b.dataset.a;var q={delete:'حذف المقطع نهائيًا مع إعجاباته وتعليقاته؟'}[a];if(q&&!confirm(q))return;b.disabled=true;api('act',{id:id,op:a}).then(function(j){toast(j.ok?'تم ✓':'تعذّر');load()}).catch(function(){});return}
 var c=e.target.closest('[data-ca]');if(c){var cid=c.closest('[data-c]').dataset.c,ca=c.dataset.ca;if(ca==='delete'&&!confirm('حذف التعليق؟'))return;c.disabled=true;api('cact',{id:cid,op:ca}).then(function(j){toast(j.ok?'تم ✓':'تعذّر');load()}).catch(function(){})}});
if(S)start();else{$('#login').hidden=false}
})();
</script></body></html>
